x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  identifier:
    image: semtech/mu-identifier:1.11.0
    restart: always
    environment:
      SESSION_COOKIE_SECURE: "on"
    labels:
      - "logging=true"
    logging: *default-logging

  dispatcher:
    image: semtech/mu-dispatcher:2.1.1
    restart: always
    volumes:
      - ./config/dispatcher:/config
    labels:
      - "logging=true"
    logging: *default-logging

  # Your extra services here
  resource:
    image: semtech/mu-cl-resources:1.27.2
    restart: always
    environment:
      CACHE_CLEAR_PATH: "http://cache/.mu/clear-keys"
    volumes:
      - ./config/resources:/config
    labels:
      - "logging=true"
    logging: *default-logging
  cache:
    image: semtech/mu-cache:2.1.0
    restart: always
    links:
      - resource:backend
    labels:
      - "logging=true"
    logging: *default-logging

  migrations:
    image: semtech/mu-migrations-service:0.9.0
    restart: no
    links:
      - triplestore:database
    environment:
      MU_SPARQL_TIMEOUT: 600
    volumes:
      - ./config/migrations:/data/migrations
    labels:
      - "logging=true"
    logging: *default-logging

  delta-notifier:
    image: semtech/mu-delta-notifier:0.4.0
    restart: always
    volumes:
      - ./config/delta:/config/
    labels:
      - "logging=true"
    logging: *default-logging

  database:
    image: semtech/sparql-parser:0.0.15
    restart: always
    volumes:
      - ./config/authorization/:/config/
      - ./data/authorization/:/data/
    labels:
      - "logging=true"
    logging: *default-logging

  triplestore:
    image: redpencil/virtuoso:1.4.0
    restart: always
    environment:
      SPARQL_UPDATE: "true"
    volumes:
      - ./data/db:/data
      - ./config/virtuoso/virtuoso.ini:/data/virtuoso.ini
    labels:
      - "logging=true"
    logging: *default-logging

  frontend-dcat:
    image: lblod/frontend-decide-dcat:0.0.14
    restart: always
    environment:
      EMBER_ENABLE_SPARQL_ENDPOINT: true
    labels:
      - "logging=true"
    logging: *default-logging
  dcat:
    image: lblod/dcat-service:0.0.3
    restart: always
    logging: *default-logging
    labels:
      - logging=true

  #
  # LDES
  #
  ldes-client:
    image: lblod/ldes-client:0.0.5
    restart: always
    environment:
      WORKING_GRAPH: "http://mu.semte.ch/graphs/ldes/working-graph"
      RANDOMIZE_GRAPHS: true
      DIRECT_DATABASE_CONNECTION: http://triplestore:8890/sparql
      GRAPH_STORE_URL: http://triplestore:8890/sparql-graph-crud
      CRON_PATTERN: "* 23 * * * *" # Once per hour at HH:23
      # ABB feed (DECIDe TEST)
      ABB_LDES_BASE: "https://ds.decide.lblod.info/ldes/public/"
      ABB_LDES_FIRST_PAGE: "https://ds.decide.lblod.info/ldes/public/1"
      # Freiburg feed
      FREIBURG_LDES_BASE: "https://decide.datenraum-dev.freiburg.de/ldes/public/"
      FREIBURG_LDES_FIRST_PAGE: "https://decide.datenraum-dev.freiburg.de/ldes/public/1"
      # Bamberg feed
      BAMBERG_LDES_BASE: "https://ds.decide.smartcitybamberg.de/ldes/public/"
      BAMBERG_LDES_FIRST_PAGE: "https://ds.decide.smartcitybamberg.de/ldes/public/1"
      # Ghent feed
      # GHENT_LDES_BASE: TODO
      # GHENT_LDES_FIRST_PAGE: TODO
    volumes:
      - ./config/ldes-client:/config
    labels:
      - "logging=true"
    logging: *default-logging
  ldes-delta-pusher:
    image: redpencil/ldes-delta-pusher:1.2.14
    restart: always
    environment:
      LDES_BASE: "https://catalog.decide.lblod.info/ldes/"
      LDES_FOLDER: "public"
      WRITE_INITIAL_STATE: "false"
      DIRECT_DB_ENDPOINT: "http://triplestore:8890/sparql"
      AUTO_HEALING: "true"
      CRON_HEALING: "0 34 2 * * *" # Every day at 02:34
    volumes:
      - ./config/ldes-delta-pusher/:/config/
      - ./data/ldes-feed/:/data/
    logging: *default-logging
    labels:
      - "logging=true"
    links:
      - triplestore:database
  ldes-serve-feed:
    image: lblod/ldes-serve-feed-service:0.4.0
    restart: always
    environment:
      BASE_URL: "https://catalog.decide.lblod.info/ldes/"
    volumes:
      - ./data/ldes-feed/:/data/
    logging: *default-logging
    labels:
      - "logging=true"
